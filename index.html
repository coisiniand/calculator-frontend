<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Calculator</title>
  <style>
    :root {
      --bg-1: #060b16;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.78);
      --panel-strong: rgba(17, 24, 39, 0.94);
      --panel-soft: rgba(30, 41, 59, 0.8);
      --primary: #8b5cf6;
      --primary-2: #60a5fa;
      --accent: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --text: #edf2ff;
      --muted: #aab5d1;
      --border: rgba(148, 163, 184, 0.18);
      --shadow: 0 28px 60px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 18px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.18), transparent 20%),
        radial-gradient(circle at bottom right, rgba(96, 165, 250, 0.14), transparent 25%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .app {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: 1.05fr 1.35fr;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .calculator {
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .display-wrap {
      min-height: 132px;
      padding: 20px 18px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.72));
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }

    #display {
      width: 100%;
      text-align: right;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.04em;
      word-break: break-all;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      min-height: 62px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }

    .digit,
    .dot {
      background: linear-gradient(145deg, rgba(51, 65, 85, 0.9), rgba(30, 41, 59, 0.9));
      color: var(--text);
    }

    .operator {
      background: linear-gradient(145deg, rgba(139, 92, 246, 0.9), rgba(96, 165, 250, 0.9));
      color: #f8faff;
    }

    .utility {
      background: linear-gradient(145deg, rgba(14, 165, 233, 0.2), rgba(45, 212, 191, 0.14));
      color: #d9f9ff;
    }

    .equal {
      background: linear-gradient(145deg, rgba(52, 211, 153, 0.9), rgba(6, 182, 212, 0.85));
      color: #041b16;
      grid-row: span 2;
    }

    .zero {
      grid-column: span 2;
    }

    .history-panel {
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: rgba(15, 23, 42, 0.72);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 0;
    }

    h2 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .clear-btn {
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.14);
      color: #fecaca;
      padding: 10px 14px;
      font-size: 0.88rem;
      border-radius: 10px;
    }

    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .history-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .expr {
      font-size: 1.05rem;
      line-height: 1.4;
      color: var(--text);
      word-break: break-word;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .result {
      font-size: 1.15rem;
      font-weight: 700;
      color: #a7f3d0;
      white-space: nowrap;
    }

    .delete-btn {
      min-width: 74px;
      min-height: 40px;
      border-radius: 10px;
      background: rgba(248, 113, 113, 0.15);
      color: #fecaca;
      font-size: 0.86rem;
    }

    .empty {
      padding: 22px 16px;
      border-radius: 16px;
      border: 1px dashed rgba(148, 163, 184, 0.22);
      color: var(--muted);
      text-align: center;
      background: rgba(15, 23, 42, 0.5);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel calculator" aria-label="Calculator panel">
      <div class="display-wrap">
        <div id="display" aria-live="polite">0</div>
      </div>

      <div class="keys" aria-label="Calculator keys">
        <button type="button" class="utility" data-action="clear">C</button>
        <button type="button" class="utility" data-action="delete">DEL</button>
        <button type="button" class="operator" data-value="/">÷</button>
        <button type="button" class="operator" data-value="*">×</button>

        <button type="button" class="digit" data-value="7">7</button>
        <button type="button" class="digit" data-value="8">8</button>
        <button type="button" class="digit" data-value="9">9</button>
        <button type="button" class="operator" data-value="-">−</button>

        <button type="button" class="digit" data-value="4">4</button>
        <button type="button" class="digit" data-value="5">5</button>
        <button type="button" class="digit" data-value="6">6</button>
        <button type="button" class="operator" data-value="+">＋</button>

        <button type="button" class="digit" data-value="1">1</button>
        <button type="button" class="digit" data-value="2">2</button>
        <button type="button" class="digit" data-value="3">3</button>
        <button type="button" class="equal" data-action="calculate">=</button>

        <button type="button" class="digit zero" data-value="0">0</button>
        <button type="button" class="dot" data-value=".">.</button>
      </div>
    </section>

    <aside class="panel history-panel" aria-label="History panel">
      <div class="history-header">
        <h2>History</h2>
        <button type="button" class="clear-btn" id="clearHistoryButton">Clear</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </aside>
  </div>

  <script>
    const API_BASE = "https://github.com/coisiniand/calculator-backend.git";
    const display = document.getElementById("display");
    const historyList = document.getElementById("historyList");
    const clearHistoryButton = document.getElementById("clearHistoryButton");
    let expression = "";

    function setDisplay(value) {
      display.textContent = value || "0";
    }

    function append(value) {
      expression += value;
      setDisplay(expression);
    }

    function removeLast() {
      expression = expression.slice(0, -1);
      setDisplay(expression || "0");
    }

    function reset() {
      expression = "";
      setDisplay("0");
    }

    async function calculate() {
      const value = expression.trim();
      if (!value) {
        setDisplay("0");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/calculate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ expression: value })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || "Invalid expression");
        }

        expression = data.result;
        setDisplay(expression);
        await loadHistory();
      } catch (error) {
        alert(error.message || "Calculation failed");
      }
    }

    function renderHistory(items) {
      if (!items || items.length === 0) {
        historyList.innerHTML = '<li class="empty">No records yet.</li>';
        return;
      }

      historyList.innerHTML = items.map((item) => `
        <li class="history-item">
          <div class="history-text">
            <span class="expr">${item.expression}</span>
            <span class="meta">${item.created_at}</span>
          </div>
          <div class="result">${item.result}</div>
          <button type="button" class="delete-btn" data-id="${item.id}">Delete</button>
        </li>
      `).join("");
    }

    async function loadHistory() {
      try {
        const response = await fetch(`${API_BASE}/api/history`);
        const data = await response.json();
        renderHistory(data.items || []);
      } catch (error) {
        historyList.innerHTML = '<li class="empty">Unable to load history.</li>';
      }
    }

    async function deleteHistoryItem(id) {
      try {
        const response = await fetch(`${API_BASE}/api/history/${id}`, { method: "DELETE" });
        if (!response.ok) {
          throw new Error("Delete failed");
        }
        await loadHistory();
      } catch (error) {
        alert("Unable to delete record.");
      }
    }

    async function clearHistory() {
      try {
        const response = await fetch(`${API_BASE}/api/history`, { method: "DELETE" });
        if (!response.ok) {
          throw new Error("Clear failed");
        }
        await loadHistory();
      } catch (error) {
        alert("Unable to clear history.");
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, value } = button.dataset;
      if (action === "clear") {
        reset();
      } else if (action === "delete") {
        removeLast();
      } else if (action === "calculate") {
        calculate();
      } else if (value) {
        append(value);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) {
        append(event.key);
      } else if (["+", "-", "*", "/", "."].includes(event.key)) {
        append(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
      } else if (event.key === "Backspace") {
        removeLast();
      } else if (event.key === "Escape") {
        reset();
      }
    });

    historyList.addEventListener("click", async (event) => {
      const button = event.target.closest(".delete-btn");
      if (!button) return;
      const id = Number(button.dataset.id);
      if (Number.isNaN(id)) return;
      await deleteHistoryItem(id);
    });

    clearHistoryButton.addEventListener("click", clearHistory);

    setDisplay("0");
    loadHistory();
  </script>
</body>
</html>
